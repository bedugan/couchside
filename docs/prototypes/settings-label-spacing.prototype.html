<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Couchside settings spacing comparison</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#111a2d;color:#fff2cc}*{box-sizing:border-box}body{margin:0;padding:24px 24px 105px}header{max-width:1060px;margin:0 auto 20px}h1{font:26px Georgia,serif;margin:4px 0 10px}header p{color:#b9d6e5;line-height:1.5;margin:5px 0}.badge{color:#efc983;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}.window{max-width:1060px;margin:auto;background:#24274d;border:3px ridge #9191b0;border-radius:7px;box-shadow:0 15px 40px #080e22}.title{text-align:center;background:#171d38;border-bottom:1px solid #727895;padding:10px;font-weight:bold}.toolbar{display:flex;justify-content:space-between;padding:13px 20px;color:#9ddce8;border-bottom:1px solid #727895;font-size:14px}.search{border:1px solid #9ba0ba;width:38%;padding:5px;color:#b1bfd5;background:#131d37}.body{display:grid;grid-template-columns:185px 1fr;min-height:490px}nav{padding:15px 8px;border-right:1px solid #767d9c}nav strong{display:block;padding:8px;color:#fff1c6}nav button{display:block;width:100%;text-align:left;padding:10px 18px;border:0;background:none;color:#7ed4ed;font-size:15px;font-weight:bold;cursor:pointer}nav button.active{background:#394c69;color:#fff1c6;border-left:3px solid #e9dc8f}main{min-width:0;padding:24px 28px 30px}h2{color:#78d7ef;border-bottom:1px solid #848dba;padding-bottom:13px;margin:0 0 28px;font-size:21px}h3{color:#78d7ef;font-size:17px;margin:25px 0 12px}.row{height:37px;display:grid;grid-template-columns:var(--label) 26px;align-items:center;gap:12px;margin-left:25px}.label{font-size:15px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:1px 1px #101120}.check{display:block;width:25px;height:25px;background:#111a2c;border:2px ridge #9ca5bc;border-radius:3px;text-align:center;color:#eaf4a2;font:bold 26px/20px Arial;text-shadow:1px 2px #000}.A{--label:215px}.B{--label:calc(100% - 185px)}.C{--label:calc(100% - 75px)}footer{display:flex;justify-content:flex-end;padding:13px 20px;border-top:1px solid #747b9a}.fake-button{padding:6px 40px;background:#7f142c;border:2px ridge #c5b8a6;border-radius:4px}.switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:8px;background:#102d3a;border:1px solid #73c4d8;border-radius:8px;box-shadow:0 4px 18px #080e22;white-space:nowrap}.switcher button{background:transparent;color:#dcf3ff;border:1px solid transparent;padding:10px;cursor:pointer;border-radius:4px}.switcher button.selected{background:#204d5e;border-color:#82cfdf}button:focus-visible{outline:3px solid #edc577;outline-offset:3px}@media(max-width:700px){body{padding:15px 8px 120px}.body{grid-template-columns:110px 1fr}nav button{padding:10px 6px;font-size:12px}main{padding:16px 12px}.row{margin-left:0}.label{font-size:12px}.A{--label:110px}.B{--label:calc(100% - 65px)}.C{--label:calc(100% - 40px)}.switcher button{font-size:11px;padding:9px 5px}.toolbar{font-size:12px}}
</style><header><span class="badge">Static comparison · no game settings changed</span><h1>Give option names room</h1><p id="description"></p><p>Switch between Quests and Minimap to compare the longest labels. Fonts and scale approximate the in-game page.</p></header><div class="window"><div class="title">Options</div><div class="toolbar"><span>Game &nbsp;&nbsp; AddOns</span><span class="search">⌕ Search</span></div><div class="body"><nav><strong>Couchside</strong><div id="pages"></div></nav><main><h2 id="pageTitle"></h2><div id="sections"></div></main></div><footer><span class="fake-button">Close</span></footer></div><div class="switcher" aria-label="Layout comparison"><button id="previous" aria-label="Previous layout">←</button><button data-variant="A">A · Current</button><button data-variant="B">B · Wider column</button><button data-variant="C">C · Far right</button><button id="next" aria-label="Next layout">→</button></div><script>
const pages={"Quests": [{"title": "Zone tracking", "labels": ["Track quests for my current zone"]}, {"title": "Quest areas", "labels": ["Mark tracked quest areas", "Show untracked quest areas"]}, {"title": "Nearby turn-ins", "labels": ["Tag turn-ins in the tracker", "Show letters on the minimap", "List untracked turn-ins"]}], "Minimap": [{"title": "Nearby tracking", "labels": ["Show scanned nearby tracking", "Scan automatically while stationary", "Resource letter stamps and other tracking"]}], "Controller": [{"title": "Action pages", "labels": ["Show action page numbers", "Only show page 2 or 3"]}]};
const descriptions={A:'A · Current. The checkbox column leaves long option names cut off.',B:'B · Wider column, recommended. More room for names, with the checkboxes kept within easy reach.',C:'C · Far right. Uses almost the full page width, with a longer gap between short names and checkboxes.'};
let params=new URLSearchParams(location.search),variant=['A','B','C'].includes(params.get('variant'))?params.get('variant'):'B',page=pages[params.get('page')]?params.get('page'):'Quests';
function render(){document.querySelector('main').className=variant;document.getElementById('description').textContent=descriptions[variant];document.getElementById('pageTitle').textContent=page;document.getElementById('pages').innerHTML=Object.keys(pages).map(p=>`<button class="${p===page?'active':''}" data-page="${p}">${p}</button>`).join('');document.getElementById('sections').innerHTML=pages[page].map(s=>`<section><h3>${s.title}</h3>${s.labels.map(l=>`<div class="row"><span class="label">${l}</span><span class="check" aria-hidden="true">✓</span></div>`).join('')}</section>`).join('');document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('selected',b.dataset.variant===variant));let u=new URL(location);u.searchParams.set('variant',variant);u.searchParams.set('page',page);history.replaceState(null,'',u);}
function cycle(d){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+d+3)%3];render();}
document.addEventListener('click',e=>{if(e.target.dataset.variant){variant=e.target.dataset.variant;render();}if(e.target.dataset.page){page=e.target.dataset.page;render();}});document.getElementById('previous').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1);}});render();
</script></html>
